# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # homeassistant is pinned for lint/mypy and updated deliberately.
      # The minimum supported release is the "homeassistant" key in
      # hacs.json (2026.3.0); CI checks that the integration loads there.
      - dependency-name: "homeassistant"
      # pytest-homeassistant-custom-component pins these to exact versions
      # (matching the Home Assistant release it is built for). Bumping them
      # on their own only produces PRs that cannot be installed (#280).
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      - dependency-name: "pytest-cov"
